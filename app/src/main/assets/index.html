<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f7f7f3"><title>Cash Compass</title>
<style>
:root{--ink:#15332e;--muted:#6d7a76;--paper:#f7f7f3;--card:#fffefd;--line:#e5e8e3;--pine:#1d665d;--mint:#d9eee5;--sun:#f9e7ad;--coral:#b95742;--shadow:0 10px 28px rgba(18,52,46,.08)}*{box-sizing:border-box}body{margin:0;background:#e5e9e6;color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.app{min-height:100vh;max-width:560px;margin:auto;padding:18px 20px 92px;background:var(--paper)}button,input,select{font:inherit}button{border:0;cursor:pointer}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:19px;font-weight:850;letter-spacing:-.05em}.brand span{display:inline-grid;place-items:center;width:30px;height:30px;margin-right:8px;border-radius:10px;background:var(--pine);color:white}.icon{width:37px;height:37px;border-radius:50%;background:white;border:1px solid var(--line);font-size:17px}.eyebrow{margin:0 0 6px;color:var(--pine);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}h1{margin:0;letter-spacing:-.06em;font-size:30px;line-height:1.06}.sub{margin:8px 0 20px;color:var(--muted);font-size:14px;line-height:1.45}.hero{padding:22px;border-radius:25px;background:var(--pine);color:white;box-shadow:0 15px 30px rgba(19,82,72,.18)}.hero small{font-weight:700;color:#d7f3e7}.money{font-size:48px;font-weight:800;letter-spacing:-.08em;line-height:1;margin:8px 0}.herofoot{display:flex;justify-content:space-between;align-items:center;font-size:12px}.hero button{padding:8px 11px;border-radius:9px;background:white;color:var(--pine);font-size:12px;font-weight:800}.bar{height:5px;margin-top:17px;background:rgba(255,255,255,.25);border-radius:99px}.bar i{display:block;height:100%;width:72%;background:#b9efd9;border-radius:99px}.section{margin-top:25px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sectionhead h2{margin:0;font-size:18px;letter-spacing:-.04em}.textbtn{background:transparent;color:var(--pine);font-weight:800;font-size:13px;padding:4px}.card{background:var(--card);border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow)}.row{display:flex;align-items:center;gap:11px;padding:14px 15px;border-bottom:1px solid var(--line)}.row:last-child{border:0}.date{width:38px;padding:5px 2px;border-radius:10px;text-align:center;background:#edf2ef;font-size:9px;font-weight:800;text-transform:uppercase;color:var(--muted)}.date b{display:block;color:var(--ink);font-size:15px;line-height:1.05}.grow{flex:1;min-width:0}.grow b{font-size:14px;display:block}.grow span{color:var(--muted);font-size:11px}.amt{font-size:14px;font-weight:850}.neg{color:var(--coral)}.pos{color:var(--pine)}.nudge{display:flex;gap:12px;padding:16px;background:var(--sun)}.spark{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:12px;background:#fff1bd}.nudge b{font-size:14px}.nudge p{margin:4px 0;color:#6e6245;font-size:12px;line-height:1.4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:15px}.metric span{display:block;color:var(--muted);font-size:11px;font-weight:700}.metric b{display:block;font-size:22px;letter-spacing:-.06em;margin-top:4px}.metric small{color:var(--pine);font-size:11px;font-weight:700}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.primary,.secondary{padding:13px;border-radius:12px;font-weight:850;font-size:14px}.primary{background:var(--pine);color:white}.secondary{background:var(--mint);color:var(--pine)}.scenario{padding:17px}.scenario h3{margin:0;font-size:16px}.scenario p{margin:5px 0;color:var(--muted);font-size:12px;line-height:1.4}.scenario .result{margin:14px 0;padding:12px;border-radius:13px;background:#eff7f3}.result span{display:block;color:var(--muted);font-size:11px;font-weight:800}.result b{display:block;margin-top:2px;color:var(--pine);font-size:26px;letter-spacing:-.06em}.goal{padding:16px;border-bottom:1px solid var(--line)}.goal:last-child{border:0}.goalhead{display:flex;gap:8px;justify-content:space-between}.goal h3{margin:0;font-size:15px}.goal p{margin:4px 0;color:var(--muted);font-size:11px}.track{height:7px;margin:12px 0 7px;border-radius:99px;background:#e7eeea;overflow:hidden}.track i{display:block;height:100%;background:var(--pine);border-radius:99px}.goalfoot{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.remove{background:transparent;color:#a56d61;text-decoration:underline;font-size:11px}.chat{padding:16px}.bubble{max-width:88%;padding:12px;margin-bottom:10px;border-radius:15px 15px 15px 4px;background:#edf5f1;font-size:13px;line-height:1.42}.bubble.me{margin-left:auto;border-radius:15px 15px 4px 15px;background:var(--pine);color:white}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0}.chip{padding:8px 9px;border:1px solid #bcd6cc;background:white;color:var(--pine);border-radius:99px;font-size:11px;font-weight:800}.ask{display:flex;gap:7px;border-top:1px solid var(--line);padding-top:11px}.ask input,.field input,.field select{width:100%;padding:10px;border:1px solid #d4ddd8;border-radius:10px;background:white;color:var(--ink)}.send{width:42px;border-radius:10px;background:var(--pine);color:white}.note{margin:11px 3px;font-size:10px;line-height:1.4;color:var(--muted)}.settings{padding:16px}.field{display:block;margin-bottom:11px;color:var(--muted);font-size:12px;font-weight:800}.field input{display:block;margin-top:5px}.toggle{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.toggle:last-child{border:0}.toggle b{font-size:14px}.toggle span{display:block;margin-top:3px;color:var(--muted);font-size:11px}.switch{width:42px;height:23px;padding:3px;border-radius:30px;background:#d6ddda}.switch i{display:block;width:17px;height:17px;border-radius:50%;background:white}.switch.on{background:var(--pine)}.switch.on i{transform:translateX(19px)}.nav{position:fixed;z-index:3;bottom:0;left:50%;transform:translateX(-50%);display:flex;justify-content:space-around;width:min(560px,100%);padding:8px 13px calc(9px + env(safe-area-inset-bottom));background:rgba(255,254,253,.96);border-top:1px solid var(--line);backdrop-filter:blur(12px)}.nav button{min-width:54px;background:transparent;color:#89938f;font-size:10px;font-weight:750}.nav i{display:block;font-size:19px;font-style:normal;line-height:21px}.nav .active{color:var(--pine)}.nav .active i{display:inline-block;padding:1px 9px;border-radius:9px;background:var(--mint)}.modalbg{position:fixed;z-index:8;inset:0;padding:15px;display:flex;align-items:end;background:rgba(15,42,36,.38)}.modal{width:min(560px,100%);margin:auto;padding:17px;background:var(--paper);border-radius:23px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modal h2{margin:0;font-size:20px;letter-spacing:-.05em}.close{background:transparent;font-size:24px;color:var(--muted)}.field{margin-top:12px}.kind{display:flex;gap:7px;margin-top:13px}.kind label{flex:1;padding:9px;border-radius:10px;background:#e7eeea;text-align:center;font-size:12px;font-weight:800;color:var(--pine)}.kind input{width:auto;margin-right:5px}.modal .primary{width:100%;margin-top:15px}.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}@media(min-width:561px){body{padding:18px 0}.app{border-radius:26px;box-shadow:0 16px 55px rgba(0,0,0,.12);min-height:calc(100vh - 36px)}.nav{bottom:18px;border-radius:0 0 26px 26px}}
</style></head><body><main id="app" class="app"></main><script>
const app=document.getElementById('app');const key='cash-compass-v1';let view='home',modal='',reply='';const iso=d=>d.toISOString().slice(0,10),future=n=>{let d=new Date();d.setDate(d.getDate()+n);return iso(d)},cash=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n||0),esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const base=()=>({name:'Jordan',balance:842,rate:28,tax:18,reminders:true,incomes:[{id:1,label:'Expected shift pay',amount:1176,date:future(7)}],bills:[{id:2,label:'Phone plan',amount:58,date:future(2)},{id:3,label:'Internet',amount:70,date:future(4)},{id:4,label:'Transit pass',amount:42,date:future(6)},{id:5,label:'Rent',amount:1150,date:future(11)}],goals:[{id:6,label:'Emergency cushion',target:1200,saved:435,monthly:60},{id:7,label:'Weekend away',target:450,saved:155,monthly:35}]});let s;try{s=JSON.parse(localStorage.getItem(key))||base()}catch(e){s=base()}function save(){localStorage.setItem(key,JSON.stringify(s))}function date(x){return new Date(x+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}function badge(x){let d=new Date(x+'T12:00');return '<div class="date">'+d.toLocaleDateString('en-US',{month:'short'})+'<b>'+d.getDate()+'</b></div>'}function data(){let now=iso(new Date()),inc=s.incomes.filter(x=>x.date>=now).sort((a,b)=>a.date.localeCompare(b.date)),next=inc[0],pay=next?next.date:future(7),bills=s.bills.filter(x=>x.date>=now&&x.date<=pay),held=bills.reduce((n,x)=>n+x.amount,0),goals=s.goals.reduce((n,x)=>n+(+x.monthly||0),0),days=Math.max(1,Math.ceil((new Date(pay+'T12:00')-new Date(now+'T12:00'))/86400000)),safe=Math.max(0,s.balance-held-goals);return{next:next,pay:pay,bills:bills,held:held,goals:goals,days:days,safe:safe}}function top(){return '<header class="top"><div class="brand"><span>↗</span>cash compass</div><button class="icon" data-a="profile">◌</button></header>'}function nav(){let items=[['home','⌂','Today'],['plan','▦','Plan'],['goals','◎','Goals'],['coach','✦','Coach'],['profile','◌','You']];return '<nav class="nav">'+items.map(x=>'<button class="'+(view===x[0]?'active':'')+'" data-a="'+x[0]+'"><i>'+x[1]+'</i>'+x[2]+'</button>').join('')+'</nav>'}function home(){let d=data(),events=[].concat(d.bills.map(x=>Object.assign({type:'bill'},x)),d.next?[Object.assign({type:'income'},d.next)]:[]).sort((a,b)=>a.date.localeCompare(b.date));return top()+'<p class="eyebrow">Your cash runway</p><h1>Hey, '+esc(s.name)+'.</h1><p class="sub">A calm plan for the days before your next paycheck.</p><section class="hero"><small>Safe to spend before next income</small><div class="money">'+cash(d.safe)+'</div><div class="herofoot"><span>'+cash(d.safe/d.days)+' / day · '+d.days+' days</span><button data-a="plan">See plan</button></div><div class="bar"><i></i></div></section><section class="section"><div class="sectionhead"><h2>Coming up</h2><button class="textbtn" data-a="plan">Full timeline</button></div><div class="card">'+(events.length?events.slice(0,3).map(x=>'<div class="row">'+badge(x.date)+'<div class="grow"><b>'+esc(x.label)+'</b><span>'+(x.type==='income'?'Expected income':'Due '+date(x.date))+'</span></div><strong class="amt '+(x.type==='income'?'pos':'neg')+'">'+(x.type==='income'?'+':'−')+cash(x.amount).slice(1)+'</strong></div>').join(''):'<div class="empty">Add income or bills to see your plan.</div>')+'</div></section><section class="section"><div class="card nudge"><div class="spark">✦</div><div><b>One small move for today</b><p>'+cash(d.held)+' in bills lands before your next pay. Your forecast already protects them.</p><button class="textbtn" data-a="coach">Ask the coach →</button></div></div></section>'+nav()}function plan(){let d=data(),all=[].concat(s.incomes.map(x=>Object.assign({type:'income'},x)),s.bills.map(x=>Object.assign({type:'bill'},x))).filter(x=>x.date>=iso(new Date())).sort((a,b)=>a.date.localeCompare(b.date));let run=s.balance;return top()+'<p class="eyebrow">30-day runway</p><h1>Your plan</h1><p class="sub">All numbers come from the plan you enter. No bank connection needed.</p><div class="grid"><div class="card metric"><span>Next income</span><b>'+cash(d.next?d.next.amount:0)+'</b><small>'+date(d.pay)+'</small></div><div class="card metric"><span>Bills before pay</span><b>'+cash(d.held)+'</b><small>'+d.bills.length+' protected</small></div></div><section class="section"><div class="sectionhead"><h2>Timeline</h2><button class="textbtn" data-a="entry">Add item</button></div><div class="card">'+(all.length?all.map(x=>{run+=x.type==='income'?x.amount:-x.amount;return '<div class="row">'+badge(x.date)+'<div class="grow"><b>'+esc(x.label)+'</b><span>'+(x.type==='income'?'Expected income':'Bill payment')+'</span></div><div><strong class="amt '+(x.type==='income'?'pos':'neg')+'">'+(x.type==='income'?'+':'−')+cash(x.amount).slice(1)+'</strong><span class="grow" style="font-size:10px;color:#6d7a76">est. '+cash(run)+'</span></div></div>'}).join(''):'<div class="empty">Start by adding your income and bills.</div>')+'</div><div class="actions"><button class="secondary" data-a="income">+ Income</button><button class="secondary" data-a="bill">+ Bill</button></div></section><section class="section"><div class="card scenario"><h3>What if you work less?</h3><p>Model a change without changing your plan.</p><div class="result"><span>Safe to spend after 12 fewer hours</span><b>'+cash(Math.max(0,d.safe-12*s.rate*(1-s.tax/100)))+'</b></div><p>At your '+cash(s.rate)+'/hour rate, that is a planning estimate after your '+s.tax+'% tax set-aside.</p></div></section>'+nav()}function goals(){return top()+'<p class="eyebrow">Set aside with purpose</p><h1>Your goals</h1><p class="sub">Flexible monthly set-asides make room for what matters.</p><section class="section"><div class="sectionhead"><h2>In progress</h2><button class="textbtn" data-a="goal">Add goal</button></div><div class="card">'+(s.goals.length?s.goals.map(g=>{let p=Math.min(100,Math.round(g.saved/g.target*100));return '<article class="goal"><div class="goalhead"><div><h3>'+esc(g.label)+'</h3><p>'+cash(g.monthly)+' set aside each month</p></div><b>'+cash(g.saved)+' / '+cash(g.target)+'</b></div><div class="track"><i style="width:'+p+'%"></i></div><div class="goalfoot"><span>'+p+'% there</span><button class="remove" data-a="delete" data-id="'+g.id+'">Remove</button></div></article>'}).join(''):'<div class="empty">Start a goal and it will be reserved in your plan.</div>')+'</div></section>'+nav()}function coach(){let d=data(),text=reply||'I am your cash-flow planning partner. Right now you have '+cash(d.safe)+' set aside for flexible spending before '+date(d.pay)+'. What would you like to model?';return top()+'<p class="eyebrow">Planning companion</p><h1>Ask anything cash-flow.</h1><p class="sub">Simple answers from the plan on this device.</p><section class="section"><div class="card chat"><div class="bubble">'+esc(text)+'</div><div class="chips"><button class="chip" data-a="ask" data-q="safe">Safe today?</button><button class="chip" data-a="ask" data-q="bills">Bills before pay</button><button class="chip" data-a="ask" data-q="hours">12 fewer hours</button><button class="chip" data-a="ask" data-q="tax">Tax set-aside</button></div><form class="ask" id="askForm"><input name="q" placeholder="Ask about your plan" required><button class="send">↑</button></form></div><p class="note">Cash Compass provides budgeting education and estimates from your entries. It is not financial, tax, legal, or investment advice.</p></section>'+nav()}function profile(){return top()+'<p class="eyebrow">Your settings</p><h1>Make it yours.</h1><p class="sub">Your plan is stored locally on this device.</p><section class="section"><div class="card settings"><form id="profileForm"><label class="field">Your name<input name="name" value="'+esc(s.name)+'" required></label><label class="field">Cash available now<input name="balance" type="number" min="0" value="'+s.balance+'" required></label><label class="field">Hourly rate for scenarios<input name="rate" type="number" min="0" value="'+s.rate+'" required></label><label class="field">Tax set-aside (%)<input name="tax" type="number" min="0" max="80" value="'+s.tax+'" required></label><button class="primary">Save changes</button></form></div></section><section class="section"><div class="card settings"><div class="toggle"><div><b>Upcoming bills</b><span>A gentle heads-up before an item is due</span></div><button class="switch '+(s.reminders?'on':'')+'" data-a="toggle"><i></i></button></div></div></section><button class="textbtn" data-a="reset">Reset demo data</button>'+nav()}function entry(kind){kind=kind||'income';return '<div class="modalbg"><section class="modal"><div class="modalhead"><h2>Add to your plan</h2><button class="close" data-a="close">×</button></div><form id="entryForm"><div class="kind"><label><input type="radio" name="kind" value="income" '+(kind==='income'?'checked':'')+'>Income</label><label><input type="radio" name="kind" value="bill" '+(kind==='bill'?'checked':'')+'>Bill</label></div><label class="field">Name<input name="label" placeholder="Weekend shifts or electric bill" required></label><label class="field">Amount<input name="amount" type="number" min="1" required></label><label class="field">Date<input name="date" type="date" value="'+future(7)+'" required></label><button class="primary">Add item</button></form></section></div>'}function goalModal(){return '<div class="modalbg"><section class="modal"><div class="modalhead"><h2>New goal</h2><button class="close" data-a="close">×</button></div><form id="goalForm"><label class="field">What are you saving for?<input name="label" required></label><label class="field">Goal amount<input name="target" type="number" min="1" required></label><label class="field">Already set aside<input name="saved" type="number" min="0" value="0" required></label><label class="field">Monthly set-aside<input name="monthly" type="number" min="0" required></label><button class="primary">Add goal</button></form></section></div>'}function render(){let screens={home:home,plan:plan,goals:goals,coach:coach,profile:profile};app.innerHTML=screens[view]()+ (modal==='entry'?entry():modal==='income'?entry('income'):modal==='bill'?entry('bill'):modal==='goal'?goalModal():'')}function answer(q){let d=data(),x=q.toLowerCase();if(x.includes('bill'))return 'Before your next income, protect '+d.bills.map(b=>b.label+' ('+cash(b.amount)+')').join(', ')+'. That is '+cash(d.held)+' total.';if(x.includes('hour')||x.includes('12')||x.includes('work'))return 'Twelve fewer hours changes your take-home estimate by about '+cash(12*s.rate*(1-s.tax/100))+'. Your safe-to-spend amount would be about '+cash(Math.max(0,d.safe-12*s.rate*(1-s.tax/100)))+'.';if(x.includes('tax'))return 'A '+s.tax+'% set-aside on your next expected income is about '+cash((d.next?d.next.amount:0)*s.tax/100)+'. This is a planning estimate; adjust it for your situation or a tax professional.';return 'You can safely use up to '+cash(d.safe)+' before '+date(d.pay)+'—about '+cash(d.safe/d.days)+' per day. Bills and your monthly goals are already held back.'}document.addEventListener('click',e=>{let b=e.target.closest('[data-a]');if(!b)return;let a=b.dataset.a;if(['home','plan','goals','coach','profile'].includes(a)){view=a;modal=''}else if(['entry','income','bill','goal'].includes(a)){modal=a}else if(a==='close'){modal=''}else if(a==='ask'){reply=answer(b.dataset.q);view='coach'}else if(a==='toggle'){s.reminders=!s.reminders;save()}else if(a==='delete'){s.goals=s.goals.filter(x=>String(x.id)!==b.dataset.id);save()}else if(a==='reset'){s=base();save();reply=''}render()});document.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);if(e.target.id==='entryForm'){let x={id:Date.now(),label:f.get('label'),amount:+f.get('amount'),date:f.get('date')};if(f.get('kind')==='income')s.incomes.push(x);else s.bills.push(x);modal='';view='plan'}if(e.target.id==='goalForm'){s.goals.push({id:Date.now(),label:f.get('label'),target:+f.get('target'),saved:+f.get('saved'),monthly:+f.get('monthly')});modal='';view='goals'}if(e.target.id==='profileForm'){s.name=f.get('name');s.balance=+f.get('balance');s.rate=+f.get('rate');s.tax=+f.get('tax')}if(e.target.id==='askForm'){reply=answer(f.get('q'));view='coach'}save();render()});render();
</script></body></html>
