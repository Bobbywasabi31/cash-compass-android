name: Build and publish Android preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          cmdline-tools-version: '12266719'
      - name: Test cash-flow calculations and JavaScript syntax
        run: |
          node --test tests/*.test.cjs
          node --check app/src/main/assets/app.js
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Compile APK and run Android lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and test on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest # Connected tests remove the app during cleanup; reinstall it for the screenshot.
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.cashcompass.app.preview/com.cashcompass.app.MainActivity
            sleep 2
            adb shell screencap -p /sdcard/odddough.png
            adb pull /sdcard/odddough.png app/build/odddough.png
      - name: Resolve release naming
        # Single source of truth for versioned names: versionName in app/build.gradle.kts.
        # The tag, title, and APK filename below all come from this step's outputs —
        # a tag/title mismatch (e.g. v1.60.1-preview.91 tagged with a 1.61.0 title)
        # is structurally impossible now.
        run: |
          scripts/release-naming.sh app/build.gradle.kts "$GITHUB_RUN_NUMBER" \
            | while IFS='=' read -r k v; do echo "$k=$v" >> "$GITHUB_ENV"; done
          cat "$GITHUB_ENV" | grep -E '^(VERSION|TAG|TITLE|APK)=' || true
      - name: Prepare verified APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${{ env.APK }}"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "dist/${{ env.APK }}"
          cd dist
          sha256sum "${{ env.APK }}" > SHA256SUMS.txt
      - name: Save build and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-and-reports
          path: |
            dist/
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/build/odddough.png
          if-no-files-found: ignore
      - name: Publish downloadable preview
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag and title come from the Resolve release naming step — one version source.
          # Only the latest version's notes — keeps the releases page short
          awk '/^# /{if(++c>1) exit} {print}' RELEASE_NOTES.md > dist/NOTES.md
          gh release create "$TAG" "dist/$APK" dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "$TITLE" --prerelease --notes-file dist/NOTES.md
