name: Build and publish Android preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          cmdline-tools-version: '12266719'
      - name: Test cash-flow calculations and JavaScript syntax
        run: |
          node --test tests/core.test.cjs
          node --check app/src/main/assets/app.js
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Compile APK and run Android lint
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and test on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            adb shell am start -n com.cashcompass.app.preview/com.cashcompass.app.MainActivity
            sleep 2
            adb shell screencap -p /sdcard/cash-compass.png
            adb pull /sdcard/cash-compass.png app/build/cash-compass.png
      - name: Prepare verified APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Cash-Compass-1.1.0-preview.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs dist/Cash-Compass-1.1.0-preview.apk
          cd dist
          sha256sum Cash-Compass-1.1.0-preview.apk > SHA256SUMS.txt
      - name: Save build and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-and-reports
          path: |
            dist/
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/build/cash-compass.png
          if-no-files-found: ignore
      - name: Publish downloadable preview
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.1.0-preview.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/Cash-Compass-1.1.0-preview.apk dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Cash Compass 1.1.0 preview ${GITHUB_RUN_NUMBER}" --prerelease --notes-file RELEASE_NOTES.md
